<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Drama Auto Cutter</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101827;
  color:white;
  padding:20px;
}
.container{
  max-width:600px;
  margin:auto;
}
h1{text-align:center;color:#38bdf8}
.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}
input,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:8px;
  border:0;
  font-size:16px;
}
button{
  background:#0284c7;
  color:white;
  font-weight:bold;
}
button:disabled{opacity:.5}
video{width:100%;margin-top:15px}
#status{color:#38bdf8}
</style>
</head>
<body>
<div class="container">
<h1>🎬 AI Drama Auto Cutter</h1>
<div class="card">
<h3>Upload Drama Video</h3>
<input type="file" id="videoFile" accept="video/mp4,video/*">
<video id="preview" controls hidden></video>

<label>ចំនួននាទីក្នុងមួយ Part</label>
<input type="number" id="minutes" value="1" min="1" max="60">

<button id="cutBtn" onclick="cutVideo()">✂️ Cut Video</button>
<p id="status">សូម Upload វីដេអូរបស់អ្នក</p>
<div id="results"></div>
</div>
</div>

<script>
const fileInput=document.getElementById('videoFile');
const preview=document.getElementById('preview');
let videoURL='';

fileInput.addEventListener('change',()=>{
  const file=fileInput.files[0];
  if(!file)return;
  if(videoURL)URL.revokeObjectURL(videoURL);
  videoURL=URL.createObjectURL(file);
  preview.src=videoURL;
  preview.hidden=false;
  document.getElementById('status').textContent=
  'វីដេអូបាន Upload រួចរាល់!';
});

async function cutVideo(){
  const file=fileInput.files[0];
  const minutes=Number(document.getElementById('minutes').value);

  if(!file){
    alert('សូម Upload វីដេអូជាមុន!');
    return;
  }
  if(!minutes||minutes<1){
    alert('សូមបញ្ចូលចំនួននាទីត្រឹមត្រូវ!');
    return;
  }

  const btn=document.getElementById('cutBtn');
  const status=document.getElementById('status');
  const results=document.getElementById('results');

  btn.disabled=true;
  results.innerHTML='';
  status.textContent='កំពុងរៀបចំវីដេអូ...';

  try{
    const duration=await new Promise((resolve,reject)=>{
      preview.onloadedmetadata=()=>resolve(preview.duration);
      preview.onerror=()=>reject(new Error('មិនអាចអានវីដេអូបាន'));
      if(preview.readyState>=1)resolve(preview.duration);
    });

    const partSeconds=minutes*60;
    const totalParts=Math.ceil(duration/partSeconds);

    status.textContent=
    'បានបែងចែកជាផែនការ '+totalParts+' Parts។';

    for(let i=0;i<totalParts;i++){
      const start=i*partSeconds;
      const end=Math.min(start+partSeconds,duration);
      const item=document.createElement('div');
      item.className='card';
      item.innerHTML=
      '<h3>Part '+(i+1)+'</h3>'+
      '<p>'+formatTime(start)+' - '+formatTime(end)+'</p>'+
      '<button>ចំណែកវីដេអូ '+(i+1)+'</button>';
      results.appendChild(item);
    }

    status.textContent=
    'ការវិភាគពេលវេលាបានបញ្ចប់!';

  }catch(error){
    status.textContent='មានបញ្ហា: '+error.message;
  }finally{
    btn.disabled=false;
  }
}

function formatTime(s){
  const m=Math.floor(s/60);
  const sec=Math.floor(s%60);
  return m+':'+String(sec).padStart(2,'0');
}
</script>
</body>
</html>
