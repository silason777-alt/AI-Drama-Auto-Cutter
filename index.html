
<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Drama Auto Cutter</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101426;color:white;font-family:Arial,sans-serif}
.container{max-width:600px;margin:auto}
h1{text-align:center;color:#64d8ff}
.card{background:#1c2540;padding:20px;border-radius:16px;margin-top:18px}
label{display:block;margin:16px 0 8px}
input,select,button{width:100%;padding:14px;border-radius:10px;border:0;font-size:16px}
button{background:#168cff;color:white;font-weight:bold;margin-top:20px}
button:disabled{opacity:.5}
.note{color:#b9c5dd;font-size:13px;line-height:1.6}
#status{margin-top:16px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="container">
<h1>🎬 AI Drama Auto Cutter</h1>
<p style="text-align:center">Automatic Video Cutting Tool</p>

<div class="card">
<label>📁 Upload MP4 Video</label>
<input type="file" id="video" accept="video/mp4,video/*">

<label>✂️ Cutting Mode</label>
<select id="mode">
<option value="time">Auto Time Cutter</option>
<option value="scene">AI Scene Cutter (Coming Soon)</option>
</select>

<label>⏱️ Part Duration</label>
<select id="duration">
<option value="60">1 Minute</option>
<option value="120">2 Minutes</option>
<option value="180">3 Minutes</option>
<option value="300">5 Minutes</option>
</select>

<button id="start">START CUTTING</button>
<div id="status"></div>
<div id="downloads"></div>
</div>

<p class="note">
Note: This is the initial interface. Video processing and MP4 export will be added in the next development step.
</p>
</div>

<script>
document.getElementById("start").addEventListener("click",()=>{
 const file=document.getElementById("video").files[0];
 const status=document.getElementById("status");
 if(!file){
   status.textContent="Please upload a video first.";
   return;
 }
 status.textContent="Video selected: "+file.name+
 "\nNext step: connect the video cutting engine.";
});
</script>
</body>
</html>
